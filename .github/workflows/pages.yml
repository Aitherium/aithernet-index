name: check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A push made with the default GITHUB_TOKEN (the daily re-check's state commit) does
  # NOT start a `push` workflow. Without this, suspended entries would be saved but the
  # published site would keep showing them until some other push happened. This rebuilds
  # from the new state/health.json as soon as the re-check finishes.
  workflow_run:
    workflows: ["recheck"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python check.py --self-test
      - run: python intake.py --self-test
      - run: python artifact.py --self-test
      - run: python fingerprint.py
      - run: python recheck.py --self-test
      - run: python -m unittest discover -s tests -v
      - run: pip install . && awindex --self-test && awindex --root records check
      - run: python check.py
      - run: python build_site.py --out _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
