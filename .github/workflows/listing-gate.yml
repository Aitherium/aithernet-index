name: listing-gate

# Every pull request is judged BEFORE it can be merged: backlink artifact, live
# health, keyless reputation/poisoned-domain lookups, and look-alike detection.
# Keyless sources only plus the default GITHUB_TOKEN -- no new CI secret (owner
# rule). Anything that needs a secret (URLhaus/ShadowBroker HMAC) runs on the
# fleet and posts its own commit status `aithernet/reputation`, which branch
# protection also requires.
#
# WHY NO `paths:` FILTER. This check is REQUIRED on main, so it has to report on
# every pull request. A path-filtered workflow creates no check run at all when
# the paths do not match, and GitHub then shows the required check as
# "Expected" forever -- blocking README PRs. The gate itself is cheap and exits
# 0 when the PR adds or changes no record ("nothing to judge").
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: listing-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  listing-gate:
    name: listing-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: unit tests (no network)
        run: python -m unittest discover -s tests -v

      # The gate's code and policy come from the BASE commit, not from the PR.
      # A pull_request run checks out the PR's own tree, so a PR could otherwise
      # rewrite tools/gate_config.json (e.g. add its author to intake_pr_authors)
      # or the rule itself and pass its own gate. Records are still read from
      # the PR head by git. Bootstrap only: a base with no gate uses the PR's.
      - name: check out the gate from the base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:tools/listing_gate.py" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/gate-base" "$BASE_SHA"
            echo "GATE=$RUNNER_TEMP/gate-base/tools/listing_gate.py" >> "$GITHUB_ENV"
          else
            echo "::warning::base has no listing gate yet; using the PR's (bootstrap)"
            echo "GATE=tools/listing_gate.py" >> "$GITHUB_ENV"
          fi

      - name: judge changed records
        id: gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # Set by GitHub; a Discord / bot-stamped record needs the intake bot here.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SUMMARY: ${{ runner.temp }}/listing-gate-summary.md
          VERDICTS: ${{ runner.temp }}/listing-gate.json
        run: |
          set +e
          python "$GATE" \
            --root . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --labels-json "$PR_LABELS" \
            --summary "$SUMMARY" \
            --json "$VERDICTS"
          code=$?
          if [ -f "$SUMMARY" ]; then cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: update the sticky pull request comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ runner.temp }}/listing-gate-summary.md
        run: |
          if [ -f "$SUMMARY" ]; then
            python "${GATE:-tools/listing_gate.py}" \
              --comment-file "$SUMMARY" \
              --pr "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}"
          else
            echo "gate produced no summary (it could not judge); leaving any previous comment"
          fi
