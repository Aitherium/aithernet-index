name: Submit a site
description: Suggest a website, digital garden, room or space for the AitherNet Index.
title: "Submit: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        A bot turns this into a pull request. It checks that the URL answers, stamps what it
        could verify, and a maintainer reviews it. Own the site? Serve
        `/.well-known/aithernet.json` with `{"records": ["<id>"]}` and the entry is marked
        **owner-proven**.

        **Discord communities:** pick kind `discord`, put the permanent invite in URL, and
        fill the three Discord fields. The Aither bot is in your server and saw you hold
        Manage Server, so the entry is marked **owner-proven by the Aither bot** once staff
        approve it. Add the bot and ask it to list your server; the bot files this for you.
  - type: input
    id: url
    attributes:
      label: URL
      description: The https:// address. For a Discord community, the permanent invite.
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options: [site, business, garden, room, space, dataset, org, service, discord]
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma separated, up to 8.
      placeholder: python, docs, reference
  - type: input
    id: keyword
    attributes:
      label: Keyword
      description: Optional .aither keyword, like an old AOL keyword.
      placeholder: my-site.aither
  - type: markdown
    attributes:
      value: |
        **Discord communities (kind `discord`):** the three fields below are required. The
        Aither bot fills them when it files the listing; a person submitting by hand must
        already have had the bot observe Manage Server in that server.
  - type: input
    id: discord_guild
    attributes:
      label: Discord server id
      description: The server's id (17-20 digits). Never a member list.
    validations:
      required: false
  - type: input
    id: discord_manager
    attributes:
      label: Requested by
      description: discord:<the managing user's id>
      placeholder: discord:123456789012345678
    validations:
      required: false
  - type: input
    id: discord_band
    attributes:
      label: Member band
      description: One of 1-99, 100-499, 500-999, 1k-4.9k, 5k-9.9k, 10k-49k, 50k+ (optional).
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        **Businesses:** the fields below are optional. They become your listing page and are
        published as schema.org data that search engines and AI agents read. Listing asks you
        to accept no terms and to release no legal claims. See https://index.aitherium.com/claim/
  - type: input
    id: about
    attributes:
      label: About
      description: One or two sentences (up to 500 characters).
  - type: input
    id: category
    attributes:
      label: Category
      placeholder: bakery
  - type: input
    id: address
    attributes:
      label: Address
      description: Leave empty if you do not want a street address public.
  - type: input
    id: area_served
    attributes:
      label: Area served
      placeholder: Springfield, or Worldwide
  - type: input
    id: phone
    attributes:
      label: Phone
  - type: input
    id: email
    attributes:
      label: Public email
  - type: textarea
    id: hours
    attributes:
      label: Hours
      description: One line each, like "Mo-Fr 09:00-17:00" or "Sa,Su 10:00-14:00".
  - type: textarea
    id: why
    attributes:
      label: Why it belongs
      description: What it is and why someone would want to find it.
    validations:
      required: true
  - type: checkboxes
    id: honest
    attributes:
      label: Honesty
      options:
        - label: I am not paid to submit this, or I say so above.
          required: true
